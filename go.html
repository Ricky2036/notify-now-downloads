<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="refresh" content="2;url=Notify%20Now.apk" />
<title>Notify Now · 准备下载</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f4f7fb;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px; color: #111827;
    -webkit-font-smoothing: antialiased;
  }
  .box {
    width: 100%; max-width: 360px;
    background: #fff;
    border-radius: 24px;
    padding: 40px 28px;
    text-align: center;
    box-shadow: 0 24px 60px rgba(17,40,95,.10);
    animation: fadeUp .45s cubic-bezier(.22,1,.36,1) both;
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  .spinner {
    width: 40px; height: 40px; margin: 0 auto 18px;
    border: 3px solid #e5e7eb; border-top-color: #2563eb;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
  p { font-size: 14px; color: #6b7280; line-height: 1.6; }
  a { color: #2563eb; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <h1>正在准备下载</h1>
    <p>若未自动开始，请 <a href="Notify%20Now.apk">点击此处</a> 重新下载。</p>
  </div>

<script>
  const OWNER = "Ricky2036";
  const REPO  = "notify-now-downloads";
  const PATH  = "count.json";
  const GH_TOKEN = "REPLACE_WITH_FINE_GRAINED_PAT";
  const API = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`;
  function b64(s){ return btoa(unescape(encodeURIComponent(String(s)))); }
  function ub64(s){ return decodeURIComponent(escape(atob(s))); }
  async function readCount(){ const r=await fetch(API,{cache:"no-store"}); if(!r.ok) throw 0; const d=await r.json(); return {count:parseInt(ub64(d.content),10)||0, sha:d.sha}; }
  async function writeCount(c,sha){ const r=await fetch(API,{method:"PUT",headers:{"Authorization":"Bearer "+GH_TOKEN,"Content-Type":"application/json","Accept":"application/vnd.github+json"},body:JSON.stringify({message:"bump via qr",content:b64(c),sha})}); if(!r.ok) throw 0; }
  async function bumpCount(){
    if (GH_TOKEN === "REPLACE_WITH_FINE_GRAINED_PAT") return;
    try { let {count,sha}=await readCount(); for(let i=0;i<3;i++){ try{ await writeCount(count+1,sha); return; }catch(e){ const r=await readCount(); count=r.count; sha=r.sha; } } } catch(e){}
  }
  window.addEventListener("load", async () => {
    try { await bumpCount(); } catch (e) {}
    setTimeout(() => location.href = "Notify%20Now.apk", 800);
  });
</script>
</body>
</html>
