<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Notify Now · 下载</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f4f7fb;
    --bg-2: #eef4fc;
    --card: #ffffff;
    --txt: #111827;
    --sub: #6b7280;
    --muted: #9ca3af;
    --pri: #2563eb;
    --pri-dark: #1d4ed8;
    --shadow: 0 24px 60px rgba(17,40,95,.10), 0 8px 24px rgba(17,40,95,.06);
  }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: radial-gradient(1200px 600px at 50% -20%, #ffffff 0%, transparent 60%),
                linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px; color: var(--txt);
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 100%; max-width: 420px;
    background: var(--card);
    border: 1px solid rgba(255,255,255,.8);
    border-radius: 32px;
    padding: 48px 32px 40px;
    text-align: center;
    box-shadow: var(--shadow);
    animation: fadeUp .55s cubic-bezier(.22,1,.36,1) both;
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }

  .app-logo {
    width: 88px; height: 88px;
    border-radius: 22px;
    margin: 0 auto 24px;
    display: block;
    box-shadow: 0 12px 30px rgba(37,99,235,.18);
  }

  h1 { font-size: 30px; font-weight: 800; letter-spacing: -.3px; margin-bottom: 10px; }
  .sub { font-size: 15px; color: var(--sub); line-height: 1.7; margin-bottom: 28px; }

  .btn {
    display: inline-block;
    background: var(--pri);
    color: #fff; text-decoration: none;
    font-size: 16px; font-weight: 600;
    padding: 15px 40px; border-radius: 16px;
    box-shadow: 0 10px 24px rgba(37,99,235,.28);
    transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
  }
  .btn:hover { background: var(--pri-dark); box-shadow: 0 12px 28px rgba(37,99,235,.34); }
  .btn:active { transform: scale(.975); }

  .divider { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 12px; margin: 32px 0 18px; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #e5e7eb; }

  .qr-wrap {
    background: #fff; width: 170px; height: 170px; margin: 0 auto 12px;
    border-radius: 18px; padding: 10px;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid #e5e7eb;
    box-shadow: 0 8px 24px rgba(17,40,95,.06);
  }
  .qr-wrap img { width: 100%; height: 100%; display: block; }
  .qr-cap { font-size: 13px; color: var(--sub); font-weight: 600; margin-bottom: 3px; }
  .qr-tip { font-size: 11px; color: var(--muted); line-height: 1.5; }

  .dlstat {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    margin-top: 26px;
    padding: 8px 16px;
    background: #f0fdf4;
    border: 1px solid #dcfce7;
    border-radius: 999px;
    font-size: 13px; color: #15803d;
  }
  .dlstat b { color: #16a34a; font-weight: 700; }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #22c55e; position: relative; flex: none;
  }
  .dot::after {
    content: ""; position: absolute; inset: 0;
    border-radius: 50%; background: #22c55e;
    animation: pulse 1.6s ease-out infinite;
  }
  @keyframes pulse {
    0% { transform: scale(1); opacity: .55; }
    100% { transform: scale(2.8); opacity: 0; }
  }
</style>
</head>
<body>
  <div class="card">
    <img class="app-logo" src="app_icon.png" alt="Notify Now" />
    <h1>Notify Now</h1>
    <p class="sub">一键发送标准 / 媒体 / 进度 / 来电通知，<br/>实时预览 Android 系统表现。</p>

    <a class="btn" href="Notify%20Now.apk" download onclick="bumpCount()">立即下载（1.1MB）</a>

    <div class="divider">扫码下载</div>
    <div class="qr-wrap"><img id="qr" src="qr.png" alt="扫码下载" /></div>
    <p class="qr-cap">手机扫码，直接下载安装包</p>
    <p class="qr-tip">Android 需允许「未知来源」安装</p>

    <div class="dlstat">
      <span class="dot"></span>
      <span>已下载 <b id="dl-count">—</b> 次</span>
    </div>
  </div>

<script>
  // ===== GitHub 计数器配置 =====
  const OWNER = "Ricky2036";
  const REPO  = "notify-now-downloads";
  const PATH  = "count.json";
  // 前端写入需令牌：用「仅本仓库 contents:write」的 fine-grained PAT 替换下方占位。
  const GH_TOKEN = "REPLACE_WITH_FINE_GRAINED_PAT";
  const API = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`;

  const el = () => document.getElementById("dl-count");
  function setCount(n) { if (typeof n === "number" && !isNaN(n)) el().textContent = n; }
  function b64(s) { return btoa(unescape(encodeURIComponent(String(s)))); }
  function ub64(s) { return decodeURIComponent(escape(atob(s))); }

  async function readCount() {
    const r = await fetch(API, { cache: "no-store" });
    if (!r.ok) throw new Error("read " + r.status);
    const d = await r.json();
    return { count: parseInt(ub64(d.content), 10) || 0, sha: d.sha };
  }
  async function writeCount(count, sha) {
    const r = await fetch(API, {
      method: "PUT",
      headers: {
        "Authorization": "Bearer " + GH_TOKEN,
        "Content-Type": "application/json",
        "Accept": "application/vnd.github+json"
      },
      body: JSON.stringify({ message: "bump download count", content: b64(count), sha })
    });
    if (!r.ok) throw new Error("write " + r.status);
    return r.json();
  }
  async function refreshCount() {
    try { const { count } = await readCount(); setCount(count); } catch (e) {}
  }
  async function bumpCount() {
    // 乐观更新：点击瞬间本地 +1，立即反馈
    const cur = parseInt(el().textContent, 10);
    if (!isNaN(cur)) setCount(cur + 1);
    // 用 GitHub API 自增（带冲突重试）
    if (GH_TOKEN === "REPLACE_WITH_FINE_GRAINED_PAT") { refreshCount(); return; }
    try {
      let { count, sha } = await readCount();
      for (let i = 0; i < 3; i++) {
        try { const d = await writeCount(count + 1, sha); setCount(count + 1); return; }
        catch (e) { const r = await readCount(); count = r.count; sha = r.sha; }
      }
    } catch (e) { refreshCount(); }
  }

  window.addEventListener("load", refreshCount);
  setInterval(refreshCount, 30000); // 覆盖手机扫码下载后电脑页面刷新
</script>
</body>
</html>
